<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 p-4 flex items-center justify-center">
    <main class="w-full max-w-sm rounded-2xl border bg-white p-6 shadow-lg">
        <h1 class="mb-5 text-xl font-bold text-gray-800">Admin Login</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <p class="mb-4 rounded-lg p-3 text-sm {{ 'bg-emerald-50 text-emerald-800' if category == 'success' else 'bg-red-50 text-red-700' }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        {% if error %}
        <p class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
        {% endif %}
        <form method="post" class="space-y-4">
            <label class="block text-sm font-medium text-gray-700">
                Username or mobile
                <input name="username" autocomplete="username" required class="mt-1 w-full rounded-lg border px-3 py-2">
            </label>
            <label class="block text-sm font-medium text-gray-700">
                Password
                <input name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border px-3 py-2">
            </label>
            <button class="w-full rounded-lg bg-blue-600 py-2 font-semibold text-white hover:bg-blue-700">Login</button>
        </form>
        <a href="/" class="mt-4 inline-block text-sm text-blue-700 underline">Return to entry form</a>
    </main>
</body>
</html>
