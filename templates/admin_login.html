<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login · Field Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --ground: #F4F1E9;
            --surface: #FFFFFF;
            --ink: #16302A;
            --line: rgba(22, 48, 42, 0.14);
            --line-strong: rgba(22, 48, 42, 0.24);
            --action: #1B7F52;
            --action-deep: #146244;
            --action-soft: #EAF3ED;
            --ring: rgba(27, 127, 82, 0.16);
            --shadow-card: 0 1px 2px rgba(22, 48, 42, 0.04), 0 18px 44px -28px rgba(22, 48, 42, 0.55);
        }

        body {
            background: var(--ground);
            color: var(--ink);
            font-family: 'Hind Siliguri', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .field {
            background: var(--surface);
            color: var(--ink);
            border: 1.5px solid var(--line-strong);
            border-radius: 12px;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        .field:focus,
        .field:focus-visible {
            outline: none;
            border-color: var(--action);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .btn {
            transition: background-color .18s ease, transform .16s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4">
    <main class="w-full max-w-[360px]">
        <div class="mb-4 flex items-center gap-2.5">
            <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#16302A] text-white" aria-hidden="true">
                <i class="ph-bold ph-plugs-connected text-[18px]"></i>
            </span>
            <div class="leading-tight">
                <p class="text-[15px] font-bold">Field Log</p>
                <p class="text-[11.5px] text-[#16302A]/70">Admin access</p>
            </div>
        </div>

        <div class="rounded-[20px] border border-[#16302A]/[0.14] bg-white p-5" style="box-shadow: var(--shadow-card)">
            <h1 class="text-[18px] font-bold leading-tight">Sign in</h1>
            <p class="mt-0.5 text-[12.5px] text-[#16302A]/72">Username or mobile number</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <p class="mt-3 rounded-xl border px-3 py-2 text-[12.5px] {{ 'border-[#1B7F52]/25 bg-[#EAF3ED] text-[#146244]' if category == 'success' else 'border-[#B3261E]/25 bg-[#FBEAE8] text-[#B3261E]' }}" role="status">{{ message }}</p>
                {% endfor %}
            {% endwith %}
            {% if error %}
            <p class="mt-3 rounded-xl border border-[#B3261E]/25 bg-[#FBEAE8] px-3 py-2 text-[12.5px] text-[#B3261E]" role="alert">{{ error }}</p>
            {% endif %}

            <form method="post" class="mt-3 space-y-2.5">
                <input type="hidden" name="next" value="{{ next_url }}">
                <label class="block text-[12px] font-semibold text-[#16302A]/78">Username or mobile
                    <input name="username" autocomplete="username" required class="field mt-1 h-11 w-full px-3 text-[14px] font-medium">
                </label>
                <label class="block text-[12px] font-semibold text-[#16302A]/78">Password
                    <input name="password" type="password" autocomplete="current-password" required class="field mt-1 h-11 w-full px-3 text-[14px]">
                </label>
                <button class="btn h-11 w-full rounded-xl bg-[#1B7F52] text-[14px] font-semibold text-white hover:bg-[#146244]">Sign in</button>
            </form>
        </div>

        <a href="/" class="mt-4 inline-flex items-center gap-1.5 text-[12.5px] font-semibold text-[#146244] underline decoration-[#146244]/35 underline-offset-2">
            <i class="ph-bold ph-arrow-left text-[13px]" aria-hidden="true"></i>Back to entry form
        </a>
    </main>
</body>
</html>
